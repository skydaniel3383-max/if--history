g.N.map(n=>n.dead?"":n.war?ln(n,"lw"):n.al?ln(n,"la"):"").join("")+
g.N.map((n,i)=>{const r=(2.5+n.pw/16)*f*1.1,c=n.dead?"cd":n.war?"cw":n.al?"ca":n.rel>20?"cf":n.rel<-30?"ch":"";

`<g class="me"><circle cx="${X(P0[0])}" cy="${Y(P0[1])}" r="${((4.5+g.terr*1.2)*f).toFixed(2)}"/><text x="${X(P0[0])}" y="${(Y(P0[1])+(4.5+g.terr*1.2)*f+3*f).toFixed(2)}" font-size="${(3*f).toFixed(2)}">${esc(g.s.c)}</text></g></svg><div class="lg">🟢동맹 🔴전쟁 🔵우호 🟠적대 ⚪중립 · 원 크기=국력 · 지도는 관련 지역으로 자동 확대</div>`}
function panel(){const g=G,n=g.N[g.sel];if(!n)return`<div class="card mu">지도의 국가를 눌러 외교·전쟁을 펼치세요.</div>`;
if(n.dead)return`<div class="card">${esc(n.n)}은(는) 이미 우리의 영토입니다.</div>`;

(n.war?b("atk","⚔ 공격")+(g.nuke>=3?b("nuke","☢ 핵 공격"):"")+b("peace","🕊 평화 제안"):
b("gift","🎁 선물","금화 40")+b("trade","📦 교역 협정")+(n.al?b("brk","💔 동맹 파기"):b("ally","🤝 동맹 제안"))+b("trib","👑 조공 요구")+b("war","🔥 선전포고")+b("spy","🕵 이간계","금화 30"))+`</div></div>`}
function pol(){const g=G,b=(id,l,c)=>`<button onclick="A('${id}')">${l} <span class="mu">${c}</span></button>`;
return `<div class="card"><b>내정</b><div class="g2" style="margin-top:6px"><button onclick="G.tax=(G.tax+1)%3;R()">💹 세율 변경 (무료)</button>${b("sys","🏛 정치체제 변경","금화 100")}${b("mil","🛡 군사 증강","금화 60")}${b("res","🔬 기술 연구","금화 60")}${b("inv","🌾 경제 투자","금화 50")}${b("wel","🎎 복지·축제","금화 40")}${g.nuke<3?b("dev","☢ 핵 개발","금화 120·기술55+"):`<button disabled>☢ 핵 개발 완료</button>`}</div></div>`}
function A(id){if(id=="sys")return sysPick();const g=G,n=g.N[g.sel],s=g.st,C={mil:60,res:60,inv:50,wel:40,dev:120,gift:40,spy:30}[id]||0;
if(g.gold<C){g.msg="금화가 부족합니다.";return R()}
if(id=="dev"&&s.t<55){g.msg="핵 개발에는 기술 55 이상이 필요합니다.";return R()}
const nt=["gift","trade","ally","brk","trib","war","spy","atk","nuke","peace"].includes(id);if(nt&&(!n||n.dead)){g.msg="먼저 지도에서 대상 국가를 고르세요.";return R()}
const ck=id+(["mil","res","inv","wel","dev"].includes(id)?"":g.sel),ex=(g.cd[ck]||0)-g.t;if(ex>0){g.msg=`재사용까지 ${ex}개월`;return R()}g.cd[ck]=g.t+(CD[id]||0);g.gold-=C;let m="";const adj=(k,v)=>s[k]=cl(s[k]+v),a=`${dtx()} — `;
switch(id){
case"mil":adj("m",8);m="군을 증강했다. 군사 +8";break;case"res":adj("t",8);m="학자와 장인을 후원했다. 기술 +8";break;
case"inv":adj("e",7);m="도로와 농지에 투자했다. 경제 +7";break;case"wel":adj("s",10);m="백성에게 잔치를 베풀었다. 민심 +10";break;
case"dev":g.nuke++;m=g.nuke>=3?"핵 개발에 성공! 군사 +15, 외교 -10":`핵 개발 진행 ${g.nuke}/3`;if(g.nuke>=3){adj("m",15);adj("d",-10)}break;
case"gift":n.rel=Math.min(100,n.rel+15);m=`${n.n}에 선물을 보냈다. 관계 +15`;break;
case"trade":if(n.rel>-20){n.tr=1;n.rel+=8;adj("e",5);m=`${n.n}과(와) 교역 협정 체결. 매 턴 금화 +10`}else m=`${n.n}이(가) 협정을 거부했다.`;break;
case"ally":if(n.rel>=35&&Math.random()<.4+n.rel/200){n.al=1;adj("d",6);m=`${n.n}과(와) 동맹을 맺었다!`}else m=`${n.n}이(가) 동맹 제안을 거절했다. (관계 35 이상 필요)`;break;
case"brk":n.al=0;n.rel-=30;adj("d",-5);m=`${n.n}과(와) 동맹을 파기했다.`;break;
case"trib":if(n.pw<P()*.6&&!n.al&&Math.random()<.6){g.gold+=50;n.rel-=25;m=`${n.n}이(가) 조공을 바쳤다. 금화 +50`}else{n.rel-=20;m=`${n.n}이(가) 조공 요구를 일축했다.`}break;
case"spy":g.N.forEach(o=>{if(o!=n&&!o.dead&&!o.al)o.rel-=5});n.rel-=12;m="첩자를 풀어 주변국의 불화를 부추겼다.";break;
case"war":n.war=1;n.al=0;n.rel=-80;adj("d",-4);adj("s",-3);m=`${n.n}에 선전포고했다!`;break;
case"peace":if(Math.random()<.35+(n.pw<P()?.3:0)||n.pw<20){n.war=0;n.rel=-20;m=`${n.n}과(와) 휴전했다.`}else m="상대가 평화 제안을 거부했다.";break;
case"nuke":n.pw=Math.max(0,n.pw-70);adj("d",-25);adj("s",-5);g.N.forEach(o=>{if(o!=n&&!o.dead)o.rel-=25});m=`☢ ${n.n}에 핵을 투하했다. 세계가 경악했다.`;if(n.pw<=0)m+=conq(n);break;
case"atk":{const me=P()+rn(0,30),en=n.pw+rn(0,30);if(me>en){n.pw=Math.max(0,n.pw-rn(15,30));adj("m",-3);g.gold+=20;m=`${n.n}의 군대를 격파했다. 금화 +20`;if(n.pw<=0)m+=conq(n)}else{adj("m",-10);adj("s",-4);m=`${n.n}에게 패배했다. 군사 -10, 민심 -4`}}}
g.msg=m;g.log.push(a+m);R()}
function conq(n){n.dead=1;n.war=0;n.al=0;G.terr++;G.st.e=cl(G.st.e+8);G.st.s=cl(G.st.s+3);G.gold+=40;return ` ${n.n}을(를) 병합했다! 경제 +8, 금화 +40`}
const SPD=[0,1100,500,170],CD={mil:6,res:6,inv:6,wel:6,dev:12,gift:3,trade:6,ally:6,trib:12,spy:6,atk:2,peace:6,nuke:12},AU={mon:3,the:3,dic:5,com:4,rep:1,dem:0},cf=v=>Math.max(0,Math.min(100,v)),
dtx=()=>{const g=G;return `${g.s.y+Math.floor(g.t/12)}년 ${g.t%12+1}월`},$g=i=>document.getElementById(i),
sig=()=>JSON.stringify(G.N.map(n=>[Math.round(n.pw/3),n.war,n.al,n.dead]));
function hud(){const g=G;if(!g||!$g("dt"))return;$g("dt").textContent=dtx();$g("inf").innerHTML=`🏛 ${SY[g.sy].n} · 💰 ${Math.floor(g.gold)} · 세율 ${["낮음","보통","높음"][g.tax]} · ${g.nuke>=3?"☢ 핵 보유":"핵 개발 "+g.nuke+"/3"}`;$g("sts").innerHTML=stats(g.st)}
function say(t){G.msg=t;const m=$g("msg");if(m)m.textContent=t}
function mapUp(){if($g("mp")){$g("mp").innerHTML=map();$g("pn").innerHTML=panel()}}
function spd(i){const g=G;if(!g||g.over)return;g.sp=i;if(i)g.last=i;clearTimeout(g.tm);document.querySelectorAll("#spd button").forEach((b,j)=>b.className=j==i?"p":"");if(i)loop()}
function loop(){const g=G;if(!g||g.over||!g.sp)return;tick();if(G===g&&!g.over&&g.sp)g.tm=setTimeout(loop,SPD[g.sp])}
addEventListener("keydown",e=>{if(e.code=="Space"&&G&&!G.over&&!$g("ov")&&$g("spd")){e.preventDefault();spd(G.sp?0:G.last)}});
function tick(){const g=G,s=g.st,Y=SY[g.sy];g.t++;
const base=Math.round(s.e*.5)+[-8,0,15][g.tax]+g.N.filter(n=>n.tr&&!n.dead).length*10+g.terr*10;
g.gold+=(base*Y.inc-s.m*.25*Y.up)/8;
if(g.gold<0){g.gold=0;s.s=cf(s.s-.4);s.m=cf(s.m-.2)}
const sp=[3,0,-5][g.tax];s.s=cf(s.s+(sp<0?sp*Y.tol:sp)/120);s.e=cf(s.e+(s.t-50)/120);s.t=cf(s.t+Y.tg/120);
const W=g.N.filter(n=>n.war&&!n.dead),al=g.N.filter(n=>n.al&&!n.dead).length;
W.forEach(n=>{s.m=cf(s.m-Math.max(.3,n.pw/8-al*2)/12);s.s=cf(s.s-(2+Y.ws)/12)});
if(g.t%6==0)half();if(g.t%12==0)year();
if(s.s<=0)return end("민중 혁명","백성의 분노가 폭발해 정권이 무너졌다.");
if(s.m<=0&&W.length)return end("나라의 멸망","군이 무너져 적에게 수도를 내주었다.");
if(g.t>=g.max*12)return end();
if(--g.evIn<=0){g.evIn=rn(30,54);trigger()}
hud()}
function half(){const g=G;let c=0;g.N.forEach(n=>{if(n.dead||n.war)return;if(n.rel<-60&&n.pw>P()*.7&&Math.random()<.04){n.war=1;n.al=0;c=1;say(`${n.n}이(가) 우리에게 선전포고했다!`);g.log.push(`${dtx()} — ${n.n}의 선전포고`)}});if(c)mapUp()}
function year(){const g=G,Y=SY[g.sy],sg=sig();g.N.forEach(n=>{if(n.dead)return;n.pw=Math.max(5,Math.min(100,n.pw+rn(-1,2)));if(!n.war){n.rel=Math.max(-100,Math.min(100,n.rel+Y.dr*.3+(n.al?.6:n.rel>0?-.3:.3)));if(n.al&&n.rel<10){n.al=0;say(`${n.n}이(가) 동맹을 이탈했다.`)}}});if(sg!=sig())mapUp()}
function ov(h){let o=$g("ov");if(!o){o=document.createElement("div");o.id="ov";o.className="ov";document.body.appendChild(o)}o.innerHTML=`<div class="ovb">${h}</div>`}
function ovx(){const o=$g("ov");if(o)o.remove()}
async function trigger(){const g=G,s=g.st;g.resume=g.sp||1;spd(0);ov(`<div class="card">${SMP?"역사가 기록되는 중…":"사건 발생…"}</div>`);let ev=null,nar="";const sq=g.q.length?g.q.shift():null;if(sq)ev={t:sq[0],x:sq[1],c:sq[2]};
if(SMP&&!ev){try{const r=await Promise.race([SMP.json(`역사 IF 국가 시뮬레이션의 한 장면을 서술하라. 분기점: ${g.s.t}(${g.s.c}, ${g.s.y}년). 현재 ${dtx()}. 정치체제: ${SY[g.sy].n}.
수치(0~100): 경제${Math.round(s.e)} 군사${Math.round(s.m)} 기술${Math.round(s.t)} 민심${Math.round(s.s)} 외교${Math.round(s.d)}, 금화${Math.floor(g.gold)}, 핵${g.nuke>=3?"보유":"미보유"}.
이웃: ${g.N.map(n=>`${n.n}(국력${Math.round(n.pw)},관계${Math.round(n.rel)}${n.war?",전쟁":""}${n.al?",동맹":""}${n.dead?",병합":""})`).join(", ")}.
최근 행동: ${g.log.slice(-5).join(" / ")}.
JSON만 출력: {"narrative":"지난 수년간의 역사 서술 2~3문장","event":{"title":"","text":"지금 닥친 사건, 2문장","choices":[{"label":"","fx":{"e":0,"m":0,"t":0,"s":0,"d":0},"result":"한 문장"}]}}
choices는 2~3개, fx는 -15~15 정수, 시대·정치체제·분기점의 파급 효과에 맞는 구체적 내용.`,{modelTier:"quick",cache:false}),new Promise((_,j)=>setTimeout(j,35000))]);
nar=String(r.narrative||"");const e=r.event;if(e&&Array.isArray(e.choices)&&e.choices.length>=2)ev={t:String(e.title),x:String(e.text),c:e.choices.slice(0,3).map(c=>{const f={};for(const k in K)f[k]=Math.max(-15,Math.min(15,Math.round(+(c.fx||{})[k]||0)));return[String(c.label),f,String(c.result)]})}}catch(e){}}
if(G!==g||g.over)return;
if(!ev){const pl=EV.filter(x=>!g.used.slice(-8).includes(x[0])),cr=s.s<35?CE[0]:s.e<30?CE[1]:s.m<35&&g.N.some(n=>n.war&&!n.dead)?CE[2]:null,e=cr&&Math.random()<.6?cr:pl[rn(0,pl.length-1)];g.used.push(e[0]);ev={t:e[0],x:e[1],c:e[2]}}
g.ev=ev;ov(`<div class="mu">${esc(g.s.c)} · ${dtx()}</div>${stats(s)}${nar?`<div class="card">${esc(nar)}</div>`:""}<div class="card"><h2>${esc(ev.t)}</h2><p>${esc(ev.x)}</p></div>${ev.c.map((c,i)=>`<button onclick="ch(${i})">${esc(c[0])}</button>`).join("")}`)}
function ch(i){const g=G,c=g.ev.c[i];for(const k in c[1])if(K[k])g.st[k]=cl(g.st[k]+c[1][k]);g.log.push(`${dtx()} — ${g.ev.t}: ${c[0]}`);say(c[2]);ovx();hud();spd(g.resume||1)}
function risk(k){const g=G,d=AU[k]-AU[g.sy],s=g.st.s,m=g.st.m;let r=.06*Math.abs(d)+(s<40?.2:s<55?.08:s>75?-.08:0);if(d>=2)r+=.1+(s>55?.08:0);else if(d<=-2)r+=.06+(m>60?.08:0);return Math.max(.03,Math.min(.85,r))}
function sysPick(){const g=G;g.resume=g.sp;spd(0);const left=g.sysUntil-g.t;
ov(`<h2>정치체제 개혁</h2><p class="mu">금화 100 필요. 체제 격차가 클수록, 민심이 낮을수록 시민 혁명·쿠데타로 정권이 무너질 위험이 큽니다.${left>0?` (다음 개혁까지 ${left}개월)`:""}</p>${Object.keys(SY).filter(k=>k!=g.sy).map(k=>{const d=AU[k]-AU[g.sy],r=Math.round(risk(k)*100);return `<button ${left>0?"disabled":""} onclick="reform('${k}')"><b style="color:var(--ac)">${SY[k].n}</b> <span class="${r>30?"dn":"mu"}">${d>=2?"시민 혁명":d<=-2?"쿠데타":"정국 혼란"} 위험 ${r}%</span><br><span class="mu">${SY[k].d}</span></button>`}).join("")}<button onclick="ovx();spd(G.resume)">취소</button>`)}
function reform(k){const g=G,s=g.st;ovx();if(g.gold<100){say("금화(100)가 부족합니다.");return spd(g.resume)}
g.gold-=100;const d=AU[k]-AU[g.sy],r=risk(k),nm=SY[k].n;

s.s=cl(s.s-20);s.m=cl(s.m-15);g.gold=Math.floor(g.gold/2);g.sysUntil=g.t+24;say(`${nm} 개혁이 ${kind}의 기운 속에 좌초했다. 민심 -20, 군사 -15, 금화 절반 손실.`)}
else{const o=SY[g.sy],n=SY[k];for(const x in K)s[x]=cl(s[x]+((n.st[x]||0)-(o.st[x]||0)));s.s=cl(s.s-8);g.sy=k;g.sysUntil=g.t+60;say(`${nm}(으)로 체제를 개혁했다. 혼란 속에서도 정권은 살아남았다.`);g.log.push(`${dtx()} — 체제 개혁: ${nm}`)}
R();spd(g.resume)}
function end(ft,fd){G.over=true;clearTimeout(G.tm);ovx();const g=G,s=g.st,avg=(s.e+s.m+s.t+s.s+s.d)/5,sc=avg+g.terr*6+g.N.filter(n=>n.al).length*2;
const top=Object.keys(K).sort((a,b)=>s[b]-s[a])[0],nm={e:"상업과 부의 제국",m:"무력으로 군림한 강국",t:"혁신의 선도국",s:"백성이 사랑한 태평국",d:"외교로 빛난 중재자"};
const gr=ft?"F":sc>=85?"S":sc>=72?"A":sc>=60?"B":sc>=48?"C":"D";
$(`<p class="mu">${esc(g.s.t)} · ${SY[g.sy].n}</p><h1>${ft||nm[top]}</h1><div class="card"><h2 style="font-size:44px;margin:0;color:var(--ac)">${gr}</h2><p>${ft?fd:`${esc(g.s.c)}는 ${g.s.y+g.max}년, ${nm[top]}으로 기록되었다. 병합한 나라 ${g.terr}개.`}</p>${stats(s)}</div>
<h2>연대기</h2>${g.log.map(l=>`<div class="log">${esc(l)}</div>`).join("")}<button class="p" onclick="start(G.s)">같은 시나리오 재도전</button><button class="p" onclick="home()">처음으로</button>`)}
home();
</script></body></html>
